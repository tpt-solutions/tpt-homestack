# cargo-deny configuration for tpt-homestack.
# Policy: permissive licenses only; GPL/AGPL and other copyleft licenses are
# denied. Dependencies licensed Apache-2.0-only are tolerated by the checker
# but discouraged by policy — prefer MIT OR Apache-2.0 duals (see CONTRIBUTING).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# Anything not listed in `allow` (GPL, AGPL, LGPL, MPL, SSPL, EUPL, ...) is
# rejected by default.

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained, not vulnerable. It is a proc-macro, so it runs
    # only at compile time and its code is not shipped. The only path into
    # the graph is `boa_engine` (the optional `js` feature, pinned to 0.21.1).
    # Remove this entry when Boa drops `paste` or the advisory is resolved.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled only by the optional Boa JS engine" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
