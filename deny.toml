# cargo-deny configuration for tpt-homestack.
# Policy: permissive licenses only; GPL/AGPL and other copyleft licenses are
# denied. Dependencies licensed Apache-2.0-only are tolerated by the checker
# but discouraged by policy — prefer MIT OR Apache-2.0 duals (see CONTRIBUTING).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
deny = [
    "GPL-1.0", "GPL-2.0", "GPL-3.0",
    "AGPL-1.0", "AGPL-3.0",
    "LGPL-2.0", "LGPL-2.1", "LGPL-3.0",
    "MPL-1.1", "MPL-2.0",
    "SSPL-1.0",
    "EUPL-1.1", "EUPL-1.2",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
