[package]
name = "tpt-home-cli"
description = "The `tpt-home` single binary: init, migrate, run, scaffold, user and backup management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tpt-home"
path = "src/main.rs"

[dependencies]
tpt-home-core = { workspace = true }
tpt-home-api = { workspace = true }
tpt-home-bp-notes = { path = "../../blueprints/tpt-home-bp-notes", version = "0.1.0" }
tpt-home-bp-drop = { path = "../../blueprints/tpt-home-bp-drop", version = "0.1.0" }
tpt-home-bp-track = { path = "../../blueprints/tpt-home-bp-track", version = "0.1.0" }
tpt-home-plugins = { path = "../tpt-home-plugins", version = "0.1.0" }
tpt-home-mcp = { path = "../tpt-home-mcp", version = "0.1.0" }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
mimalloc = "0.1.52"

[features]
default = ["js", "https"]
# JS script plugins (Boa). Disable with --no-default-features for a smaller build.
js = ["tpt-home-plugins/js"]
https = ["tpt-home-plugins/https"]

[dev-dependencies]
tempfile = "3"
