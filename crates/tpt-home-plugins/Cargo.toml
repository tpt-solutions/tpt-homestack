[package]
name = "tpt-home-plugins"
description = "WASM plugin host for tpt-homestack: wasmi runtime, sandboxed capabilities, lifecycle and declarative UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tpt-home-core = { workspace = true }
tpt-home-macros = { workspace = true }
tpt-home-ui = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
inventory = { workspace = true }
wasmi = { workspace = true }
# Pinned JS engine for the optional `js` tier. Upgrades are deliberate.
boa_engine = { version = "=0.21.1", optional = true, default-features = false }
# Same pin as boa_engine; the derive macros expand to paths under boa_gc.
boa_gc = { version = "=0.21.1", optional = true }
tar = { workspace = true }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true }
tpt-home-api = { workspace = true }

[features]
# JS script runtime (Boa). Off by default in this crate; the CLI enables it.
js = ["dep:boa_engine", "dep:boa_gc"]
