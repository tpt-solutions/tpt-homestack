# Example community plugin. Built with:
#   cargo build -p tpt-home-bp-calendar --target wasm32-unknown-unknown --release
# then packed with the tpt-home plugin tooling (entry = plugin.wasm).

[plugin]
id = "calendar"
name = "Calendar"
version = "0.1.0"
entry = "plugin.wasm"

[permissions]
db = true

[limits]
max_fuel = 50000000
max_memory_mb = 16

[[tables]]
name = "events"
columns = [
    { name = "title", kind = "text" },
    { name = "starts_at", kind = "integer" },
]

[[pages]]
path = "/events"
title = "Calendar"
kind = "table"
table = "events"
columns = ["id", "title", "starts_at"]

[[pages]]
path = "/new"
title = "New event"
kind = "form"
fields = ["title", "starts_at"]
action = "/events"
